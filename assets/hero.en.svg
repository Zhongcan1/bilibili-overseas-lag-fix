<svg xmlns="http://www.w3.org/2000/svg" width="960" height="472" viewBox="0 0 960 472" role="img" aria-labelledby="title desc" xml:lang="en" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Noto Sans SC&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif"><title id="title">Bilibili outside China: from spinner to smooth</title><desc id="desc">Before and after, Netherlands case study, 2026-10-13. Cause A: with hardware acceleration off the WebGL renderer was SwiftShader (CPU software rendering) and Bilibili served AVC only; with it on, the GPU (D3D11) renders, HEVC and AV1 are decoded in hardware, and Bilibili serves AVC, HEVC and AV1. Cause B: on a cold 1080P60 video the assigned overseas node gave 0.4 Mbps on one connection (timeout), while the mainland node hw gave 26.3 Mbps with 8 parallel requests; 5.2 Mbps was needed. Result with pinned BTR and hardware acceleration, starting at 10:00, a part nobody had watched: playback started 3.2 s after the seek, 0 stalls in the next 40 s, 45 s buffered ahead by 10 s, 1 of 2502 frames dropped (0.04%). Single samples.</desc><style>svg{font-family:system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", Roboto, "Helvetica Neue", Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "Liberation Mono", Menlo, monospace}.num{font-variant-numeric:tabular-nums}.halo,.thalo{stroke-width:4px;stroke-linejoin:round;paint-order:stroke}.bg{fill:#fcfcfb;stroke:#e1e0d9}.tile{fill:#f3f2ee;stroke:#e1e0d9}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e1e0d9}.base{stroke:#c3c2b7}.wash{fill:#efeee9}.s1{fill:#2a78d6}.s2{fill:#eb6834}.thr{stroke:#52514e}.thrf{fill:#52514e}.good{stroke:#0ca30c}.chip{fill:none;stroke:#c3c2b7}.halo{stroke:#fcfcfb}.thalo{stroke:#f3f2ee}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19;stroke:#2c2c2a}.tile{fill:#222220;stroke:#2c2c2a}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.grid{stroke:#2c2c2a}.base{stroke:#383835}.wash{fill:#232321}.s1{fill:#3987e5}.s2{fill:#d95926}.thr{stroke:#c3c2b7}.thrf{fill:#c3c2b7}.good{stroke:#0ca30c}.chip{fill:none;stroke:#383835}.halo{stroke:#1a1a19}.thalo{stroke:#222220}}</style><rect x="0.5" y="0.5" width="959" height="471" rx="14" class="bg" stroke-width="1"/>
<text x="32.0" y="42.0" font-size="12" font-weight="600" class="t2">NETHERLANDS CASE STUDY · 2026-10-13</text>
<text x="32.0" y="80.0" font-size="30" font-weight="600" class="t1">Bilibili outside China: from spinner to smooth</text>
<text x="32.0" y="108.0" font-size="14" class="t2">Two independent causes stacked up: hardware acceleration was off (A) + cold videos weren't cached on overseas edges (B)</text>
<rect x="32.0" y="132.0" width="288.0" height="290.0" rx="12" class="tile" stroke-width="1"/>
<rect x="52.0" y="150.0" width="61.8" height="20.0" rx="10" class="chip" stroke-width="1"/>
<text x="82.9" y="164.0" font-size="11" font-weight="600" text-anchor="middle" class="t1">Cause A</text>
<text x="123.8" y="165.0" font-size="14" font-weight="600" class="t1">Rendering &amp; decoding</text>
<circle cx="58.5" cy="194.0" r="6.5" fill="none" class="thr" stroke-width="1.4"/>
<line x1="55.5" y1="194.0" x2="61.5" y2="194.0" class="thr" stroke-width="1.6" stroke-linecap="round"/>
<text x="71.0" y="198.0" font-size="12" font-weight="600" class="t2">Before</text>
<text x="52.0" y="228.0"><tspan font-size="24" class="t1">SwiftShader</tspan></text>
<text x="52.0" y="248.0" font-size="12" class="t2">HW acceleration off: the CPU does it all</text>
<circle cx="58.5" cy="278.0" r="6.5" fill="none" class="good" stroke-width="1.6"/>
<path d="M55.5,278.2l2.1,2.2l4,-4.4" fill="none" class="good" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="71.0" y="282.0" font-size="12" font-weight="600" class="t1">After</text>
<text x="52.0" y="322.0"><tspan font-size="36" font-weight="600" class="t1">GPU</tspan><tspan font-size="15" class="t2">  D3D11</tspan></text>
<text x="52.0" y="342.0" font-size="12" class="t2">HW acceleration on: HEVC / AV1 in hardware</text>
<text x="52.0" y="376.0" font-size="11" class="t2">Codecs Bilibili served</text>
<rect x="52.0" y="384.0" width="39.1" height="20.0" rx="10" class="chip" stroke-width="1"/>
<text x="71.5" y="398.0" font-size="11" font-weight="600" text-anchor="middle" class="t1">AVC</text>
<text x="103.1" y="398.0" font-size="14" text-anchor="middle" class="t2">→</text>
<rect x="115.1" y="384.0" width="39.1" height="20.0" rx="10" class="chip" stroke-width="1"/>
<text x="134.6" y="398.0" font-size="11" font-weight="600" text-anchor="middle" class="t1">AVC</text>
<rect x="160.2" y="384.0" width="46.8" height="20.0" rx="10" class="chip" stroke-width="1"/>
<text x="183.6" y="398.0" font-size="11" font-weight="600" text-anchor="middle" class="t1">HEVC</text>
<rect x="213.0" y="384.0" width="38.2" height="20.0" rx="10" class="chip" stroke-width="1"/>
<text x="232.0" y="398.0" font-size="11" font-weight="600" text-anchor="middle" class="t1">AV1</text>
<rect x="336.0" y="132.0" width="288.0" height="290.0" rx="12" class="tile" stroke-width="1"/>
<rect x="356.0" y="150.0" width="61.8" height="20.0" rx="10" class="chip" stroke-width="1"/>
<text x="386.9" y="164.0" font-size="11" font-weight="600" text-anchor="middle" class="t1">Cause B</text>
<text x="427.8" y="165.0" font-size="14" font-weight="600" class="t1">Cold 1080P60 · download</text>
<circle cx="362.5" cy="194.0" r="6.5" fill="none" class="thr" stroke-width="1.4"/>
<line x1="359.5" y1="194.0" x2="365.5" y2="194.0" class="thr" stroke-width="1.6" stroke-linecap="round"/>
<text x="375.0" y="198.0" font-size="12" font-weight="600" class="t2">Before</text>
<text x="356.0" y="228.0"><tspan font-size="24" class="t1">0.4</tspan><tspan font-size="14" class="t2"> Mbps</tspan></text>
<text x="356.0" y="248.0" font-size="12" class="t2">Assigned overseas node · 1 conn. · timeout</text>
<circle cx="362.5" cy="278.0" r="6.5" fill="none" class="good" stroke-width="1.6"/>
<path d="M359.5,278.2l2.1,2.2l4,-4.4" fill="none" class="good" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="375.0" y="282.0" font-size="12" font-weight="600" class="t1">After</text>
<text x="356.0" y="322.0"><tspan font-size="36" font-weight="600" class="t1">26.3</tspan><tspan font-size="15" class="t2"> Mbps</tspan></text>
<text x="356.0" y="342.0" font-size="12" class="t2">Mainland node hw · 8 in parallel</text>
<rect x="356.0" y="364.0" width="46.1" height="30.0" class="wash"/>
<path d="M356.0,368.0H356.0A3.5,3.5 0 0 1 359.5,371.5V373.5A3.5,3.5 0 0 1 356.0,377.0H356.0Z" class="s1"><title>0.4 Mbps</title></path>
<path d="M356.0,380.0H584.9A4.0,4.0 0 0 1 588.9,384.0V385.0A4.0,4.0 0 0 1 584.9,389.0H356.0Z" class="s2"><title>26.3 Mbps</title></path>
<line x1="402.1" y1="362.0" x2="402.1" y2="396.0" class="thr" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="400.1" y="410.0" font-size="11" class="t2">need 5.2 (1.5 × bitrate)</text>
<rect x="640.0" y="132.0" width="288.0" height="290.0" rx="12" class="tile" stroke-width="1"/>
<rect x="660.0" y="150.0" width="52.3" height="20.0" rx="10" class="chip" stroke-width="1"/>
<text x="686.1" y="164.0" font-size="11" font-weight="600" text-anchor="middle" class="t1">Result</text>
<text x="722.3" y="165.0" font-size="14" font-weight="600" class="t1">Playback after the fix</text>
<text x="660.0" y="196.0" font-size="12" class="t2">Pinned BTR + HW acceleration · same video</text>
<circle cx="666.5" cy="236.0" r="6.5" fill="none" class="good" stroke-width="1.6"/>
<path d="M663.5,236.2l2.1,2.2l4,-4.4" fill="none" class="good" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="680.0" y="250.0"><tspan font-size="44" font-weight="600" class="t1">0</tspan><tspan font-size="16" class="t1"> stalls</tspan></text>
<text x="660.0" y="272.0" font-size="12" class="t2">in 40 s from 10:00, a never-watched part</text>
<circle cx="666.5" cy="310.0" r="6.5" fill="none" class="good" stroke-width="1.6"/>
<path d="M663.5,310.2l2.1,2.2l4,-4.4" fill="none" class="good" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="680.0" y="322.0"><tspan font-size="36" font-weight="600" class="t1">0.04%</tspan><tspan font-size="16" class="t1"> dropped</tspan></text>
<text x="660.0" y="344.0" font-size="12" class="t2">1 of 2502 frames (1080P60)</text>
<line x1="660.0" y1="364.0" x2="908.0" y2="364.0" class="grid" stroke-width="1"/>
<text x="660.0" y="388.0" font-size="12" class="t2">Started 3.2 s after the seek</text>
<text x="660.0" y="404.0" font-size="12" class="t2">45 s buffered ahead after 10 s</text>
<text x="32.0" y="452.0" font-size="12" class="t2">One laptop, single samples: your numbers will differ. Method and raw data: docs/en/02-why-cdn.md</text>
</svg>
